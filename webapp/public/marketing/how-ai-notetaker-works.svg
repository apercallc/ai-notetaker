<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How AI Notetaker works</title><desc id="desc">Choose a meeting, stay present while separate audio tracks are saved locally, then review the summary and follow-up actions.</desc>
  <rect width="1200" height="760" fill="#f7f8f4" rx="36"/><text x="72" y="82" fill="#176c4b" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI NOTETAKER · A SIMPLE FLOW</text><text x="72" y="150" fill="#18241e" font-family="Arial,sans-serif" font-size="54" font-weight="700">Be present. Keep the next step.</text><text x="72" y="195" fill="#57665e" font-family="Arial,sans-serif" font-size="23">Botless meeting notes for browser and desktop calls.</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="262" width="318" height="305" rx="24" fill="#fff" stroke="#dce4dc" stroke-width="2"/><circle cx="116" cy="313" r="25" fill="#d9f3e7"/><text x="116" y="321" text-anchor="middle" fill="#176c4b" font-size="23" font-weight="700">1</text><text x="153" y="320" fill="#18241e" font-size="25" font-weight="700">Choose the call</text><text x="104" y="381" fill="#57665e" font-size="20"><tspan x="104" dy="0">Meet, Zoom, Teams, Slack:</tspan><tspan x="104" dy="32">the desktop app records any</tspan><tspan x="104" dy="32">call, in a browser or an app.</tspan></text><rect x="104" y="482" width="250" height="52" rx="13" fill="#edf7ef"/><text x="229" y="515" text-anchor="middle" fill="#176c4b" font-size="18" font-weight="700">No meeting bot joins</text>
    <path d="M410 415h38m-12-12 12 12-12 12" fill="none" stroke="#176c4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="456" y="262" width="318" height="305" rx="24" fill="#fff" stroke="#dce4dc" stroke-width="2"/><circle cx="500" cy="313" r="25" fill="#d9f3e7"/><text x="500" y="321" text-anchor="middle" fill="#176c4b" font-size="23" font-weight="700">2</text><text x="537" y="320" fill="#18241e" font-size="25" font-weight="700">Stay in the moment</text><text x="488" y="381" fill="#57665e" font-size="20"><tspan x="488" dy="0">Microphone and meeting audio</tspan><tspan x="488" dy="32">stay on separate tracks.</tspan><tspan x="488" dy="32">Recording is saved locally first.</tspan></text><rect x="488" y="482" width="250" height="52" rx="13" fill="#dfeafa"/><text x="613" y="515" text-anchor="middle" fill="#26476e" font-size="18" font-weight="700">Private by default</text>
    <path d="M794 415h38m-12-12 12 12-12 12" fill="none" stroke="#176c4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="840" y="262" width="288" height="305" rx="24" fill="#fff" stroke="#dce4dc" stroke-width="2"/><circle cx="884" cy="313" r="25" fill="#d9f3e7"/><text x="884" y="321" text-anchor="middle" fill="#176c4b" font-size="23" font-weight="700">3</text><text x="921" y="320" fill="#18241e" font-size="25" font-weight="700">Leave with a plan</text><text x="872" y="381" fill="#57665e" font-size="20"><tspan x="872" dy="0">Review the transcript,</tspan><tspan x="872" dy="32">decisions, summary, and</tspan><tspan x="872" dy="32">who owns the next action.</tspan></text><rect x="872" y="482" width="228" height="52" rx="13" fill="#fff2df"/><text x="986" y="515" text-anchor="middle" fill="#805321" font-size="18" font-weight="700">No replay required</text>
  </g>
  <rect x="72" y="624" width="1056" height="78" rx="18" fill="#18241e"/><text x="102" y="672" fill="#a9e3c5" font-family="Arial,sans-serif" font-size="19" font-weight="700">START FREE</text><text x="267" y="672" fill="#fff" font-family="Arial,sans-serif" font-size="19">Use your own AI provider keys. No account needed. Optional subscription adds cloud sync and team sync.</text>
</svg>
