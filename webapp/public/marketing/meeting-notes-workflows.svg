<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Example meeting notes workflows</title><desc id="desc">Illustrative examples for project leads, recruiters, and consultants showing decisions and follow-up details AI Notetaker can help keep track of.</desc>
  <rect width="1200" height="760" fill="#f7f8f4" rx="36"/><text x="72" y="82" fill="#176c4b" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI NOTETAKER · EXAMPLE WORKFLOWS</text><text x="72" y="150" fill="#18241e" font-family="Arial,sans-serif" font-size="54" font-weight="700">Keep the details that move work forward.</text><text x="72" y="195" fill="#57665e" font-family="Arial,sans-serif" font-size="22">Illustrative examples · Not customer reviews or endorsements</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="252" width="328" height="353" rx="24" fill="#fff" stroke="#dce4dc" stroke-width="2"/><rect x="72" y="252" width="328" height="12" rx="6" fill="#f3b76d"/><text x="104" y="319" fill="#176c4b" font-size="17" font-weight="700" letter-spacing="2">PROJECT LEAD</text><text x="104" y="370" fill="#18241e" font-size="30" font-weight="700">See what was decided.</text><text x="104" y="422" fill="#57665e" font-size="20"><tspan x="104" dy="0">“What did we agree to ship,</tspan><tspan x="104" dy="30">and who owns the follow-up?”</tspan></text><rect x="104" y="505" width="264" height="62" rx="13" fill="#edf7ef"/><text x="124" y="543" fill="#176c4b" font-size="19" font-weight="700">Decision · Owner · Due date</text>
    <rect x="436" y="252" width="328" height="353" rx="24" fill="#fff" stroke="#dce4dc" stroke-width="2"/><rect x="436" y="252" width="328" height="12" rx="6" fill="#8cc4e6"/><text x="468" y="319" fill="#176c4b" font-size="17" font-weight="700" letter-spacing="2">RECRUITER</text><text x="468" y="370" fill="#18241e" font-size="30" font-weight="700">Stay with the person.</text><text x="468" y="422" fill="#57665e" font-size="20"><tspan x="468" dy="0">“I want to listen closely and</tspan><tspan x="468" dy="30">capture useful details later.”</tspan></text><rect x="468" y="505" width="264" height="62" rx="13" fill="#edf7ef"/><text x="488" y="543" fill="#176c4b" font-size="19" font-weight="700">Key points · Next step</text>
    <rect x="800" y="252" width="328" height="353" rx="24" fill="#fff" stroke="#dce4dc" stroke-width="2"/><rect x="800" y="252" width="328" height="12" rx="6" fill="#b8a3e8"/><text x="832" y="319" fill="#176c4b" font-size="17" font-weight="700" letter-spacing="2">CONSULTANT</text><text x="832" y="370" fill="#18241e" font-size="30" font-weight="700">Follow through.</text><text x="832" y="422" fill="#57665e" font-size="20"><tspan x="832" dy="0">“What did we promise, and</tspan><tspan x="832" dy="30">what should happen next?”</tspan></text><rect x="832" y="505" width="264" height="62" rx="13" fill="#edf7ef"/><text x="852" y="543" fill="#176c4b" font-size="19" font-weight="700">Commitments · Follow-up</text>
  </g>
  <text x="72" y="671" fill="#57665e" font-family="Arial,sans-serif" font-size="18">AI Notetaker creates notes to review after a call. Always check the transcript and confirm important actions.</text>
</svg>
