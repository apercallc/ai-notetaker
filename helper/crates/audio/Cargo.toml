[package]
name = "notetaker-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notetaker-core = { path = "../core" }
cpal = "0.15"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# PulseAudio/PipeWire null-sink management on Linux goes through `pactl`
# shelled out via std::process — no extra crate needed for that; cpal
# itself talks to ALSA/PulseAudio for the actual capture.

[dev-dependencies]
tempfile = "3"
