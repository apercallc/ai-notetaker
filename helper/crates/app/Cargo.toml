[package]
name = "notetaker-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "notetaker-helper"
path = "src/main.rs"

[[bin]]
name = "notetaker-nm-host"
path = "src/nm_host_main.rs"

# NOTE: `tauri` + `tauri-build` are deliberately not yet dependencies here.
# The tray icon isn't wired up in this pass (see src/tray.rs) — add them
# back, plus tauri.conf.json / app icons / build.rs, when that lands.
[dependencies]
notetaker-core = { path = "../core" }
notetaker-audio = { path = "../audio" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs = "5"
interprocess = { version = "2", features = ["tokio"] }
