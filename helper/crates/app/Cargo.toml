[package]
name = "notetaker-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "notetaker-helper"
description = "AI Notetaker: local-first meeting recording and notes for macOS, Windows, and Linux"

[[bin]]
name = "notetaker-helper"
path = "src/main.rs"

[[bin]]
name = "notetaker-nm-host"
path = "src/nm_host_main.rs"

[dependencies]
notetaker-core = { path = "../core" }
notetaker-audio = { path = "../audio" }
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
semver = "1"
dirs = "7"
interprocess = { version = "2", features = ["tokio"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
keyring = { version = "4.2", features = ["v1"] }
# Decodes the embedded tray-state PNGs into RGBA for tauri::image::Image.
png = "0.18"
crc32fast = "1"
tempfile = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

# Free-disk queries (statvfs / GetDiskFreeSpaceExW) for the start-of-recording
# check and the disk-full auto-stop. Both crates are already in Cargo.lock via
# tauri/interprocess; they are named here only so this crate can call them.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
# Needed to hand interprocess an SDDL string for the named-pipe DACL.
widestring = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
base64 = "0.22"

[package.metadata.deb]
maintainer = "AI Notetaker contributors"
copyright = "2026 AI Notetaker contributors"
section = "sound"
priority = "optional"
depends = "libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, librsvg2-2, pulseaudio-utils"
assets = [
  ["target/release/notetaker-helper", "usr/bin/notetaker-helper", "755"],
  ["target/release/notetaker-nm-host", "usr/bin/notetaker-nm-host", "755"],
  ["../../native-messaging-host-manifest/com.ainotetaker.helper.json.template", "usr/share/ai-notetaker/com.ainotetaker.helper.json.template", "644"],
]
maintainer-scripts = "scripts/debian"
