[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/app"]

[workspace.package]
version = "0.23.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream", "multipart", "form", "query"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
bytes = "1"
base64 = "0.23"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
sha2 = "0.11"
# reqwest 0.13 leaves the rustls crypto provider to the app. Use ring instead
# of pulling in aws-lc-sys and its C toolchain requirements.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Tauri 2.11.6 still resolves the GTK 3 stack to glib 0.18.x, while the
# upstream UB fix is released only in glib 0.20. Keep the stable GTK/Tauri
# API surface and apply that one upstream fix to the otherwise unchanged
# 0.18.5 source until Tauri's stable Linux stack moves forward.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
