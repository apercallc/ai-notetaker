version: 2
updates:
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: eslint
        versions: ["10.x"]
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: cargo
    directory: /helper
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: cpal
        versions: [">=0.17.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
