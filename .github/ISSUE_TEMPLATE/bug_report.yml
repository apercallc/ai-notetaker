name: Bug report
description: Report a reproducible problem with AI Notetaker
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include provider keys, meeting recordings, transcripts, or other private data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Chrome version, helper version, and extension version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks and logs
      description: Include relevant non-sensitive errors and commands already run.
