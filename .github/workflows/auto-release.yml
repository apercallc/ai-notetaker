name: Auto release

# Every push to main that changes shipped code cuts a release: it waits for the
# other CI workflows on the same commit, bumps every version in lockstep, tags,
# and dispatches the existing Release build (which builds all OSes, publishes
# the GitHub release, and uploads to the Chrome Web Store when configured).
#
# Docs, site, marketing pages and housekeeping-only history release nothing.

on:
  push:
    branches: [main]
    paths:
      - extension/**
      - helper/**
      - packaging/**
      - webapp/**
      - "!webapp/src/marketing/**"
      - "!webapp/src/app/(marketing)/**"
      - "!webapp/public/marketing/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor, major, X.Y.Z, or auto"
        required: true
        default: auto

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and dispatch release
    runs-on: ubuntu-latest
    # Never react to our own version-bump commit.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          SELF: ${{ github.job }}
        run: |
          # Poll every check run on the commit except this workflow's own job.
          # A red or cancelled check blocks the release; no checks at all also blocks.
          # Give the other workflows a minute to register so a single fast
          # check cannot look like "everything finished".
          sleep 60
          for attempt in $(seq 1 120); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "Tag and dispatch release")]')
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required")] | length' <<<"$runs")
            if [ "$failed" -gt 0 ]; then
              echo "::error::$failed CI check(s) failed on ${SHA}; not releasing."
              jq -r '.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "  - \(.name): \(.conclusion)"' <<<"$runs"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All $total CI checks passed."
              exit 0
            fi
            echo "Waiting for CI ($pending pending of $total)..."
            sleep 30
          done
          echo "::error::Timed out waiting for CI."
          exit 1

      - name: Bump versions in lockstep
        id: bump
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          # Release only the source that passed the checks above. A queued run
          # may be superseded while CI is running; the newer push has its own run.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "version=none" >> "$GITHUB_OUTPUT"
            echo "Main advanced during CI; skipping this superseded release."
            exit 0
          fi
          version=$(node scripts/bump-version.mjs "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "none" ]; then echo "Nothing releasable since the last tag."; fi

      - name: Verify metadata before tagging
        if: steps.bump.outputs.version != 'none'
        run: |
          node scripts/validate-release-manifest.mjs release/manifest.json
          node --test scripts/bump-version.test.mjs scripts/release-manifest.test.mjs

      - name: Commit, tag, and dispatch the release build
        if: steps.bump.outputs.version != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "AI Notetaker v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"
          # Pushes made with GITHUB_TOKEN do not start other workflows, so
          # dispatch the build on the new tag explicitly (github.ref becomes the
          # tag, which is what the publish job keys on).
          gh workflow run release-build.yml --ref "v${VERSION}" -f ref="v${VERSION}"
          echo "Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
