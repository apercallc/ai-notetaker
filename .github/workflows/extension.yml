# Chrome extension — typecheck + unit tests + esbuild bundle.
# Pure Node work (vitest + jsdom, no Chrome runtime needed for the tests).

name: Extension

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: extension-coverage
          path: extension/coverage/lcov.info

      - name: Build
        run: npm run build
