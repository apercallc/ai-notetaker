name: Release build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
        default: main
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/validate-release-manifest.mjs release/manifest.json
      - name: Check package versions and protocol
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release/manifest.json'));
          const extension = JSON.parse(fs.readFileSync('extension/manifest.json'));
          const webapp = JSON.parse(fs.readFileSync('webapp/package.json'));
          const cargo = fs.readFileSync('helper/Cargo.toml', 'utf8');
          const helperVersion = cargo.match(/version\s*=\s*"([^"]+)"/u)?.[1];
          if (release.version !== extension.version || release.version !== webapp.version || release.version !== helperVersion) {
            throw new Error(`version mismatch: release=${release.version}, extension=${extension.version}, webapp=${webapp.version}, helper=${helperVersion}`);
          }
          const rustProtocol = Number(fs.readFileSync('helper/crates/core/src/native_messaging.rs', 'utf8').match(/PROTOCOL_VERSION:\s*u32\s*=\s*(\d+)/u)?.[1]);
          const extensionProtocol = Number(fs.readFileSync('extension/src/types.ts', 'utf8').match(/export const HELPER_PROTOCOL_VERSION\s*=\s*(\d+)\s*;/u)?.[1]);
          if (release.protocol.version !== rustProtocol || release.protocol.version !== extensionProtocol) {
            throw new Error(`protocol mismatch: release=${release.protocol.version}, helper=${rustProtocol}, extension=${extensionProtocol}`);
          }
          NODE

  extension:
    name: Build extension
    needs: metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package extension fallback ZIP
        run: zip -r "../ai-notetaker-extension-${GITHUB_REF_NAME}.zip" dist
      - name: Package Chrome Web Store ZIP (manifest.json at the zip root)
        # The store rejects a package with the files inside a folder, so this
        # one is built from inside dist/. The name deliberately does not start
        # with "ai-notetaker-extension" so the release manifest keeps pointing
        # at the load-unpacked fallback.
        run: (cd dist && zip -qr "../../ai-notetaker-chrome-web-store-${GITHUB_REF_NAME}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-${{ github.ref_name }}
          path: |
            ai-notetaker-extension-${{ github.ref_name }}.zip
            ai-notetaker-chrome-web-store-${{ github.ref_name }}.zip

  helper:
    name: Build desktop app (${{ matrix.os }} ${{ matrix.architecture || 'x86_64' }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            artifact: ubuntu-latest
          - os: macos-latest
            bundle: app
            target: aarch64-apple-darwin
            architecture: arm64
            artifact: macos-arm64
          - os: macos-latest
            bundle: app
            target: x86_64-apple-darwin
            architecture: x86_64
            artifact: macos-x86_64
          - os: windows-latest
            bundle: nsis
            artifact: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch as of 2026-10-02
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target || '' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Linux Tauri and audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: helper
      - run: cargo fmt --all -- --check
      - name: Check desktop UI JavaScript syntax
        run: node --check crates/app/ui/app.js
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prepare Swift runtime for macOS tests
        if: runner.os == 'macOS'
        run: |
          swift_root="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          swift_runtime="$(find -L "$swift_root" -path '*/macosx/libswift_Concurrency.dylib' -print -quit)"
          if [ -z "$swift_runtime" ]; then
            echo "Could not locate libswift_Concurrency.dylib under $swift_root." >&2
            exit 1
          fi
          lipo "$swift_runtime" -verify_arch "$(uname -m)"
          cargo test --workspace --no-run
      - run: cargo test --workspace
        env:
          # Use macOS's shared Swift runtime instead of copying Xcode dylibs
          # beside the tests, which loads duplicate Swift classes.
          DYLD_LIBRARY_PATH: ${{ runner.os == 'macOS' && '/usr/lib/swift' || '' }}
      - name: Stage pinned base VB-CABLE payload
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          ./packaging/windows/fetch-vb-cable.ps1 `
            -OutputDirectory "$env:GITHUB_WORKSPACE/helper/crates/app/resources/windows/vb-cable"
      - name: Build native bundles
        working-directory: helper/crates/app
        env:
          # Stripping Rust proc-macro dylibs makes Apple's macOS 27 loader
          # reject their LINKEDIT string-pool alignment before app bundling.
          # Other OSes retain Tauri's existing debuginfo stripping behavior.
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'macOS' && 'none' || 'debuginfo' }}
          # Signs the in-place update archives. The matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.11.5 build --no-sign ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --bundles ${{ matrix.bundle }}
      - name: Sign the in-place update archives
        # `--no-sign` above skips the Tauri updater signature too, so sign the update archives
        # (macOS .app.tar.gz, Windows setup.exe) explicitly with the updater key.
        if: runner.os != 'Linux'
        working-directory: helper
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s globstar nullglob
          signed=0
          for archive in target/**/bundle/macos/*.app.tar.gz target/**/bundle/nsis/*-setup.exe; do
            npx --yes @tauri-apps/cli@2.11.5 signer sign "$archive"
            test -s "$archive.sig"
            signed=$((signed + 1))
          done
          test "$signed" -ge 1 || { echo "::error::no update archive found to sign"; exit 1; }
      - name: Test Mac installer and package guided DMG
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 ../packaging/macos/test_installer.py
          app="target/${TARGET}/release/bundle/macos/AI Notetaker.app"
          version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          bash ../packaging/macos/build-dmg.sh "$app" "target/${TARGET}/release/bundle/dmg/AI.Notetaker_${version}_${ARCHITECTURE}-installer.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-${{ matrix.artifact }}-${{ github.ref_name }}
          path: helper/target/**/bundle

  webapp-image:
    name: Build webapp image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-notetaker-webapp
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: webapp
          file: webapp/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags || format('ai-notetaker-webapp:{0}', github.sha) }}
          labels: ${{ steps.metadata.outputs.labels }}

  dockerhub-image:
    name: Mirror webapp image to Docker Hub
    if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_NAMESPACE != ''
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ai-notetaker-webapp
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: webapp
          file: webapp/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  chrome-web-store:
    name: Upload to Chrome Web Store
    # Inactive until the listing exists: set the repository variable
    # CWS_EXTENSION_ID and the secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET and
    # CWS_REFRESH_TOKEN (see docs/chrome-web-store-listing.md).
    if: startsWith(github.ref, 'refs/tags/v') && vars.CWS_EXTENSION_ID != ''
    needs: [metadata, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-${{ github.ref_name }}
          path: store
      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "store/ai-notetaker-chrome-web-store-${GITHUB_REF_NAME}.zip" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --auto-publish

  publish-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, extension, helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-${{ github.ref_name }}
          path: release-assets/extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-ubuntu-latest-${{ github.ref_name }}
          path: release-assets/helper-ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-macos-arm64-${{ github.ref_name }}
          path: release-assets/helper-macos-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-macos-x86_64-${{ github.ref_name }}
          path: release-assets/helper-macos-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-windows-latest-${{ github.ref_name }}
          path: release-assets/helper-windows
      - name: Normalize asset file names
        # GitHub rewrites spaces in uploaded names to dots. The manifest URLs and
        # SHA256SUMS must use the names people will actually download, so make
        # the names final before anything records them.
        run: |
          find release-assets -type f -name '* *' -print0 | while IFS= read -r -d '' file; do
            mv "$file" "$(dirname "$file")/$(basename "$file" | tr ' ' '.')"
          done
      - name: Generate the signed-update manifest (latest.json)
        # The desktop app's in-place updater reads this. It fails the release if any platform's
        # update archive or signature is missing.
        run: node scripts/generate-updater-manifest.mjs release-assets "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
      - name: Generate release manifest and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CHROME_WEB_STORE_URL: ${{ vars.CHROME_WEB_STORE_URL }}
        run: |
          node scripts/generate-release-manifest.mjs release/manifest.json release-assets release-assets/release-manifest.json
          node scripts/validate-release-manifest.mjs release-assets/release-manifest.json
          find release-assets -mindepth 2 -type f \( -name '*.dmg' -o -name '*.pkg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.json' \) -exec cp {} release-assets/ \;
          cp release-assets/release-manifest.json release-assets/manifest.json
          cp webapp/docker-compose.registry.yml release-assets/
          cp webapp/.env.docker.example release-assets/env.docker.example
          (cd release-assets && find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.pkg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' -o -name 'AI.Notetaker_*.app.tar.gz' -o -name 'manifest.json' -o -name 'docker-compose.registry.yml' -o -name 'env.docker.example' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Check manifest and checksums match the files being uploaded
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'release-assets';
          const present = new Set(fs.readdirSync(dir));
          const problems = [];
          const manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, 'utf8'));
          const names = [...manifest.artifacts.map((a) => a.url), manifest.extension.fallbackZipUrl]
            .filter(Boolean)
            .map((url) => decodeURIComponent(new URL(url).pathname.split('/').pop()));
          for (const name of names) if (!present.has(name)) problems.push(`manifest names ${name}, which is not being uploaded`);
          for (const line of fs.readFileSync(`${dir}/SHA256SUMS`, 'utf8').trim().split('\n')) {
            const name = line.replace(/^[0-9a-f]{64}\s+\.?\/?/u, '');
            if (!present.has(name)) problems.push(`SHA256SUMS names ${name}, which is not being uploaded`);
            if (/\s/u.test(name) || name.startsWith('.')) problems.push(`${name} would be renamed by GitHub on upload`);
          }
          if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
          console.log(`Verified ${names.length} manifest URLs and the checksum list against the upload set.`);
          NODE
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(release-assets/SHA256SUMS release-assets/manifest.json \
            release-assets/*.dmg release-assets/*.pkg release-assets/*.msi \
            release-assets/*.exe release-assets/*.deb release-assets/*.AppImage \
            release-assets/*.zip release-assets/AI.Notetaker_*.app.tar.gz release-assets/latest.json \
            release-assets/docker-compose.registry.yml release-assets/env.docker.example)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "AI Notetaker ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${assets[@]}"
          fi
