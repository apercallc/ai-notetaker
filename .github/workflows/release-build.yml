name: Release build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
        default: main
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-release-manifest.mjs release/manifest.json
      - name: Check package versions and protocol
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release/manifest.json'));
          const extension = JSON.parse(fs.readFileSync('extension/manifest.json'));
          const webapp = JSON.parse(fs.readFileSync('webapp/package.json'));
          const cargo = fs.readFileSync('helper/Cargo.toml', 'utf8');
          const helperVersion = cargo.match(/version\s*=\s*"([^"]+)"/u)?.[1];
          if (release.version !== extension.version || release.version !== webapp.version || release.version !== helperVersion) {
            throw new Error(`version mismatch: release=${release.version}, extension=${extension.version}, webapp=${webapp.version}, helper=${helperVersion}`);
          }
          if (release.protocol.version !== 1) throw new Error(`unexpected protocol version ${release.protocol.version}`);
          NODE

  extension:
    name: Build extension
    needs: metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package extension fallback ZIP
        run: zip -r "../ai-notetaker-extension-${GITHUB_REF_NAME}.zip" dist
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.ref_name }}
          path: ai-notetaker-extension-${{ github.ref_name }}.zip

  helper:
    name: Build helper (${{ matrix.os }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb,appimage
          - os: macos-latest
            bundle: dmg
          - os: windows-latest
            bundle: msi,nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    env:
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri and audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Stage pinned base VB-CABLE payload
        if: runner.os == 'Windows'
        working-directory: .
        env:
          VB_CABLE_SHA256: ${{ vars.VB_CABLE_SHA256 }}
        shell: pwsh
        run: |
          if (-not $env:VB_CABLE_SHA256) {
            throw 'Set the repository variable VB_CABLE_SHA256 before building a Windows release.'
          }
          ./packaging/windows/fetch-vb-cable.ps1 `
            -OutputDirectory "$env:GITHUB_WORKSPACE/helper/crates/app/resources/windows/vb-cable" `
            -ExpectedSha256 $env:VB_CABLE_SHA256
      - name: Build native bundles
        working-directory: helper/crates/app
        env:
          # macOS: Tauri's bundler signs and notarizes automatically once these
          # are set (https://tauri.app/distribute/sign/macos/) — it decodes
          # APPLE_CERTIFICATE (base64 .p12) into a temporary keychain itself.
          # No-op on Linux/Windows and a no-op unsigned build on macOS when the
          # release owner has not yet supplied these repository secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes @tauri-apps/cli@latest build --bundles ${{ matrix.bundle }}
      - name: Authenticode-sign Windows bundles
        # Post-build signtool pass rather than a tauri.conf.json certificateThumbprint,
        # so it works from a secret-supplied .pfx without a pre-imported machine cert
        # store entry. Skips cleanly (unsigned build, unchanged from today) until the
        # release owner supplies these repository secrets.
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ai-notetaker-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = (Get-ChildItem -Path "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $targets = Get-ChildItem -Path "target/release/bundle" -Recurse -Include *.msi, *.exe
          foreach ($target in $targets) {
            & $signtool sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($target.FullName)" }
          }
          Remove-Item $pfxPath
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.os }}-${{ github.ref_name }}
          path: helper/target/release/bundle

  webapp-image:
    name: Build webapp image
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-notetaker-webapp
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: webapp
          file: webapp/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags || format('ai-notetaker-webapp:{0}', github.sha) }}
          labels: ${{ steps.metadata.outputs.labels }}

  dockerhub-image:
    name: Mirror webapp image to Docker Hub
    if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_NAMESPACE != ''
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ai-notetaker-webapp
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: webapp
          file: webapp/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  publish-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, extension, helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: extension-${{ github.ref_name }}
          path: release-assets/extension
      - uses: actions/download-artifact@v4
        with:
          name: helper-ubuntu-latest-${{ github.ref_name }}
          path: release-assets/helper-ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: helper-macos-latest-${{ github.ref_name }}
          path: release-assets/helper-macos
      - uses: actions/download-artifact@v4
        with:
          name: helper-windows-latest-${{ github.ref_name }}
          path: release-assets/helper-windows
      - name: Generate release manifest and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CHROME_WEB_STORE_URL: ${{ vars.CHROME_WEB_STORE_URL }}
          RELEASE_SIGNING_CONFIRMED: ${{ vars.RELEASE_SIGNING_CONFIRMED }}
        run: |
          node scripts/generate-release-manifest.mjs release/manifest.json release-assets release-assets/release-manifest.json
          node scripts/validate-release-manifest.mjs release-assets/release-manifest.json
          mkdir -p release-assets/packages
          if grep -q '"status": "published"' release-assets/release-manifest.json; then
            node scripts/render-release-packages.mjs release-assets/release-manifest.json release-assets/packages
          fi
          find release-assets -mindepth 2 -type f \( -name '*.dmg' -o -name '*.pkg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.json' -o -name '*.rb' -o -name '*.yaml' -o -name '*.nuspec' -o -name 'chocolateyinstall.ps1' \) -not -path '*/packages/*/tools/*' -exec cp {} release-assets/ \;
          cp release-assets/release-manifest.json release-assets/manifest.json
          cp webapp/docker-compose.registry.yml webapp/.env.docker.example release-assets/
          (cd release-assets && find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.pkg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' -o -name 'manifest.json' -o -name 'docker-compose.registry.yml' -o -name '.env.docker.example' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(release-assets/SHA256SUMS release-assets/manifest.json \
            release-assets/*.dmg release-assets/*.pkg release-assets/*.msi \
            release-assets/*.exe release-assets/*.deb release-assets/*.AppImage \
            release-assets/*.zip release-assets/*.rb release-assets/*.yaml \
            release-assets/*.nuspec release-assets/chocolateyinstall.ps1 \
            release-assets/docker-compose.registry.yml release-assets/.env.docker.example)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "AI Notetaker ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${assets[@]}"
          fi
