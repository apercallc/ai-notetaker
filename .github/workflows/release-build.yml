name: Release build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
        default: main
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-release-manifest.mjs release/manifest.json
      - name: Check package versions and protocol
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release/manifest.json'));
          const extension = JSON.parse(fs.readFileSync('extension/manifest.json'));
          const webapp = JSON.parse(fs.readFileSync('webapp/package.json'));
          const cargo = fs.readFileSync('helper/Cargo.toml', 'utf8');
          const helperVersion = cargo.match(/version\s*=\s*"([^"]+)"/u)?.[1];
          if (release.version !== extension.version || release.version !== webapp.version || release.version !== helperVersion) {
            throw new Error(`version mismatch: release=${release.version}, extension=${extension.version}, webapp=${webapp.version}, helper=${helperVersion}`);
          }
          if (release.protocol.version !== 1) throw new Error(`unexpected protocol version ${release.protocol.version}`);
          NODE

  extension:
    name: Build extension
    needs: metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package extension fallback ZIP
        run: zip -r "../ai-notetaker-extension-${GITHUB_REF_NAME}.zip" dist
      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ github.ref_name }}
          path: ai-notetaker-extension-${{ github.ref_name }}.zip

  helper:
    name: Build helper (${{ matrix.os }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb,appimage
          - os: macos-latest
            bundle: dmg
          - os: windows-latest
            bundle: msi,nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    env:
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri and audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Stage pinned base VB-CABLE payload
        if: runner.os == 'Windows'
        working-directory: .
        env:
          VB_CABLE_SHA256: ${{ vars.VB_CABLE_SHA256 }}
        shell: pwsh
        run: |
          if (-not $env:VB_CABLE_SHA256) {
            throw 'Set the repository variable VB_CABLE_SHA256 before building a Windows release.'
          }
          ./packaging/windows/fetch-vb-cable.ps1 `
            -OutputDirectory "$env:GITHUB_WORKSPACE/helper/crates/app/resources/windows/vb-cable" `
            -ExpectedSha256 $env:VB_CABLE_SHA256
      - name: Build native bundles
        working-directory: helper/crates/app
        env:
          # macOS: Tauri's bundler signs and notarizes automatically once these
          # are set (https://tauri.app/distribute/sign/macos/) — it decodes
          # APPLE_CERTIFICATE (base64 .p12) into a temporary keychain itself.
          # No-op on Linux/Windows and a no-op unsigned build on macOS when the
          # release owner has not yet supplied these repository secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes @tauri-apps/cli@latest build --bundles ${{ matrix.bundle }}
      - name: Authenticode-sign Windows bundles
        # Post-build signtool pass rather than a tauri.conf.json certificateThumbprint,
        # so it works from a secret-supplied .pfx without a pre-imported machine cert
        # store entry. Skips cleanly (unsigned build, unchanged from today) until the
        # release owner supplies these repository secrets.
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ai-notetaker-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = (Get-ChildItem -Path "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $targets = Get-ChildItem -Path "target/release/bundle" -Recurse -Include *.msi, *.exe
          foreach ($target in $targets) {
            & $signtool sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($target.FullName)" }
          }
          Remove-Item $pfxPath
      - uses: actions/upload-artifact@v7
        with:
          name: helper-${{ matrix.os }}-${{ github.ref_name }}
          path: helper/target/release/bundle

  webapp-image:
    name: Build webapp image
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/Dockerfile
          push: false
          tags: ai-notetaker-webapp:${{ github.sha }}
