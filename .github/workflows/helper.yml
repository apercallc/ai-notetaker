# Helper (Rust) — fmt + clippy + tests on all three target OSes.
#
# The workspace lives in helper/, so every cargo step runs with
# working-directory: helper and the cache maps the workspace explicitly.
# Linux needs the ALSA dev headers for cpal (see helper/crates/audio);
# macOS/Windows build their platform modules with no extra system deps.

name: Helper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb,appimage
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: msi,nsis
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch as of 2026-10-02
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Linux Tauri and audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: helper

      # fmt is OS-independent but cheap; clippy is genuinely per-OS because
      # the audio crate compiles a different platform module on each.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Check desktop UI JavaScript syntax
        run: node --check crates/app/ui/app.js

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Prepare Swift runtime for macOS tests
        if: runner.os == 'macOS'
        run: |
          swift_root="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          swift_runtime="$(find -L "$swift_root" -path '*/macosx/libswift_Concurrency.dylib' -print -quit)"
          if [ -z "$swift_runtime" ]; then
            echo "Could not locate libswift_Concurrency.dylib under $swift_root." >&2
            exit 1
          fi
          lipo "$swift_runtime" -verify_arch "$(uname -m)"
          cargo test --workspace --no-run

      - name: cargo test
        env:
          # macOS ships the Swift runtime in the shared cache. Copying the
          # Xcode dylibs into deps loads duplicate Swift classes in tests.
          DYLD_LIBRARY_PATH: ${{ runner.os == 'macOS' && '/usr/lib/swift' || '' }}
        run: cargo test --workspace

      # Exercise the real Tauri bundle configuration on every native runner.
      # This is intentionally unsigned: signing, notarization, and installer
      # execution require release-owner credentials and physical devices.
      - name: Build unsigned native bundle
        working-directory: helper/crates/app
        env:
          # Stripping Rust proc-macro dylibs makes Apple's macOS 27 loader
          # reject their LINKEDIT string-pool alignment before app bundling.
          # Keep release dylibs intact on macOS; other OSes retain Tauri's
          # existing debuginfo stripping behavior.
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'macOS' && 'none' || 'debuginfo' }}
        # Update archives are signed only by the release workflow, so pull requests skip them.
        run: npx --yes @tauri-apps/cli@2.11.5 build --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles ${{ matrix.bundle }}

      - name: Test Mac installer and package guided DMG
        if: runner.os == 'macOS'
        run: |
          python3 ../packaging/macos/test_installer.py
          app="target/release/bundle/macos/AI Notetaker.app"
          version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          bash ../packaging/macos/build-dmg.sh "$app" "target/release/bundle/dmg/AI.Notetaker_${version}_aarch64-installer.dmg"

      # LLVM coverage is Linux-only here because the Tauri tray and native
      # audio backends are platform-specific. The report still covers the
      # shared core and audio matching logic; the matrix above remains the
      # authoritative cross-platform compile/test gate.
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov

      - name: Shared-core coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --package notetaker-core --all-targets --summary-only --fail-under-lines 90

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch as of 2026-10-02

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit
